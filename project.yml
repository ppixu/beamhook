name: Beamhook
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4
configs:
  Debug: debug
  Release: release
  Official: release
options:
  bundleIdPrefix: com.github.ppixu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.10"
    CURRENT_PROJECT_VERSION: "16"
    CODE_SIGN_STYLE: Automatic
    ARCHS: "$(ARCHS_STANDARD)"
    # Identity of a locally built copy, defined once here because more than one
    # target needs it (the app names itself with it; the test bundle locates its
    # host by it). macOS keys the Accessibility grant to the bundle id and pins
    # it to the code requirement captured when you granted it, so a local build
    # sharing the shipping id silently invalidates the notarized build's grant
    # and vice versa — and two identically named "Beamhook.app" rows in System
    # Settings are impossible to tell apart. `Official` overrides both below.
    BEAMHOOK_APP_NAME: Beamhookdev
    BEAMHOOK_BUNDLE_ID: com.github.ppixu.beamhook.dev
  configs:
    Official:
      # The shipping identity. Never change these: macOS would orphan every
      # user's Accessibility grant and Sparkle would lose update continuity.
      BEAMHOOK_APP_NAME: Beamhook
      BEAMHOOK_BUNDLE_ID: com.github.ppixu.beamhook
targets:
  BeamhookKit:
    type: framework
    platform: macOS
    sources: [Sources/BeamhookKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.ppixu.beamhookkit
        GENERATE_INFOPLIST_FILE: YES
  Beamhook:
    type: application
    platform: macOS
    sources: [Sources/Beamhook]
    dependencies:
      - target: BeamhookKit
        embed: true
      - package: Sparkle
    settings:
      base:
        # Both follow the per-configuration identity defined in the project's
        # own settings block. Info.plist's CFBundleName/CFBundleDisplayName
        # track PRODUCT_NAME, so the app names itself correctly too.
        PRODUCT_BUNDLE_IDENTIFIER: $(BEAMHOOK_BUNDLE_ID)
        PRODUCT_NAME: $(BEAMHOOK_APP_NAME)
        # The Swift module name defaults to PRODUCT_NAME. Pin it so it stays the
        # same in every configuration — otherwise `@testable import Beamhook`
        # resolves only in the configuration whose product happens to be named
        # Beamhook, and the app-target tests stop building everywhere else.
        PRODUCT_MODULE_NAME: Beamhook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Beamhook/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Beamhook/Beamhook.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        # Notarization rejects a build that (a) lacks a secure timestamp or
        # (b) carries com.apple.security.get-task-allow. Xcode omits the
        # timestamp and *injects* get-task-allow for plain `xcodebuild build`,
        # so Release must opt out of both — otherwise Apple returns "Invalid".
        # Distribution configs only: Debug keeps get-task-allow so the debugger
        # can attach. `Official` additionally compiles in Sparkle.
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/Beamhook/Beamhook-Release.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
        Official:
          CODE_SIGN_ENTITLEMENTS: Sources/Beamhook/Beamhook-Release.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OFFICIAL_BUILD"
  BeamhookKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BeamhookKitTests]
    dependencies:
      - target: BeamhookKit
  BeamhookTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BeamhookTests]
    dependencies:
      - target: Beamhook
    settings:
      base:
        # XcodeGen derives TEST_HOST from the host TARGET's name, which is no
        # longer the product's name — without this the test bundle looks for a
        # Beamhook.app that only the Official configuration produces.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/$(BEAMHOOK_APP_NAME).app/Contents/MacOS/$(BEAMHOOK_APP_NAME)"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  BeamhookKit:
    build:
      targets:
        BeamhookKit: all
        BeamhookKitTests: [test]
    test:
      targets: [BeamhookKitTests]
  Beamhook:
    build:
      targets:
        Beamhook: all
    run:
      config: Debug
    test:
      targets: [BeamhookTests]
    archive:
      config: Official
