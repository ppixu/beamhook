name: Beamhook
options:
  bundleIdPrefix: com.github.ppixu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ARCHS: "$(ARCHS_STANDARD)"
targets:
  BeamhookKit:
    type: framework
    platform: macOS
    sources: [Sources/BeamhookKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.ppixu.beamhookkit
        GENERATE_INFOPLIST_FILE: YES
  Beamhook:
    type: application
    platform: macOS
    sources: [Sources/Beamhook]
    dependencies:
      - target: BeamhookKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.ppixu.beamhook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Beamhook/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Beamhook/Beamhook.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  BeamhookKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BeamhookKitTests]
    dependencies:
      - target: BeamhookKit
schemes:
  BeamhookKit:
    build:
      targets:
        BeamhookKit: all
        BeamhookKitTests: [test]
    test:
      targets: [BeamhookKitTests]
  Beamhook:
    build:
      targets:
        Beamhook: all
    run:
      config: Debug
