name: Beamhook
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0
options:
  bundleIdPrefix: com.github.ppixu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    ARCHS: "$(ARCHS_STANDARD)"
targets:
  BeamhookKit:
    type: framework
    platform: macOS
    sources: [Sources/BeamhookKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.ppixu.beamhookkit
        GENERATE_INFOPLIST_FILE: YES
  Beamhook:
    type: application
    platform: macOS
    sources: [Sources/Beamhook]
    dependencies:
      - target: BeamhookKit
        embed: true
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.ppixu.beamhook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Beamhook/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Beamhook/Beamhook.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        # Notarization rejects a build that (a) lacks a secure timestamp or
        # (b) carries com.apple.security.get-task-allow. Xcode omits the
        # timestamp and *injects* get-task-allow for plain `xcodebuild build`,
        # so Release must opt out of both — otherwise Apple returns "Invalid".
        # Release-only: Debug keeps get-task-allow so the debugger can attach.
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/Beamhook/Beamhook-Release.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
  BeamhookKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/BeamhookKitTests]
    dependencies:
      - target: BeamhookKit
schemes:
  BeamhookKit:
    build:
      targets:
        BeamhookKit: all
        BeamhookKitTests: [test]
    test:
      targets: [BeamhookKitTests]
  Beamhook:
    build:
      targets:
        Beamhook: all
    run:
      config: Debug
